name: Trivy

# Full vulnerability scan of everything on main. It stays outside the required Gate: a CVE
# published for a dependency already on main must not block unrelated PRs. The dependency
# review job in ci.yml blocks the vulnerable versions a PR adds; this tracks the rest in
# code scanning, where Dependabot security updates close them.
on:
  push:
    branches: [main]
  schedule:
    # Daily, so a newly published CVE shows up even when nothing is merged
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          # Without it, the action drops the severity filter for SARIF, so LOW findings would fail the run
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy
