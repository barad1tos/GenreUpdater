name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  # No paths-ignore: Gate is a required check, so it must report on every PR; a path-filtered PR would wait for it forever
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # PARALLEL JOBS: quality, security, test run simultaneously
  # ─────────────────────────────────────────────────────────────────────────────

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Format check
        run: uv run ruff format --check src/ tests/ main.py

      - name: Lint check
        run: uv run ruff check src/ tests/ main.py

      - name: Type check
        run: uv run ty check src/ main.py --python .venv

      - name: Dead code check
        run: uv run deadcode src/ --no-color

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Bandit security scan
        run: uv run bandit -r src/ -c pyproject.toml

  # Blocks only what this PR adds: a known-vulnerable dependency version. A CVE published for a
  # dependency already on main would otherwise block every unrelated PR; trivy.yml tracks those.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Block vulnerable dependencies added by this PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: |
          uv run pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --reruns 2 --reruns-delay 5 \
            --only-rerun "ConnectionError|ClientConnectorError|Connection reset" \
            -x

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ─────────────────────────────────────────────────────────────────────────────
  # GATE: requires all parallel jobs to pass
  # ─────────────────────────────────────────────────────────────────────────────

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: MkDocs build
        run: uv run mkdocs build

      - name: Validate code examples
        run: uv run pytest tests/test_docs.py -v -p no:xdist --override-ini="addopts="

  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [quality, security, test, docs, dependency-review]
    if: always()
    steps:
      - name: Check results
        run: |
          review="${{ needs.dependency-review.result }}"
          # Dependency review compares a PR's base and head, so it is skipped on pushes
          if [[ "${{ github.event_name }}" != "pull_request" && "$review" == "skipped" ]]; then
            review=success
          fi
          if [[ "${{ needs.quality.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.docs.result }}" != "success" ]] || \
             [[ "$review" != "success" ]]; then
            echo "❌ One or more checks failed"
            echo "  quality: ${{ needs.quality.result }}"
            echo "  security: ${{ needs.security.result }}"
            echo "  test: ${{ needs.test.result }}"
            echo "  docs: ${{ needs.docs.result }}"
            echo "  dependency review: ${{ needs.dependency-review.result }}"
            exit 1
          fi
          echo "✅ All checks passed"

  # ─────────────────────────────────────────────────────────────────────────────
  # RELEASE: only on version tags
  # ─────────────────────────────────────────────────────────────────────────────

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: gate
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
