# .sourcery.yaml - Sourcery AI code review configuration
# https://docs.sourcery.ai/Code-Review/Configuration/

# Exclude large fixture files from AI review
# library_snapshot.json is 14MB (37K tracks) - exceeds 150K char limit
ignore:
  - tests/fixtures/**

rule_settings:
  enable:
    - default
  # The built-in rule flags every import from the tests package, shared helpers included
  # (tests.factories, tests.mocks, a conftest); the rules below flag only test_*.py modules
  disable:
    - dont-import-test-modules

rules:
  - id: no-test-module-import-from
    description: Import shared test helpers, never a test_*.py module
    pattern: from ${module} import ...
    condition: module.matches_regex(r"(^|\.)test_\w*$")
    language: python
  - id: no-test-module-import
    description: Import shared test helpers, never a test_*.py module
    pattern: import ${module}
    condition: module.matches_regex(r"(^|\.)test_\w*$")
    language: python
  - id: no-test-module-import-name
    description: Import shared test helpers, never a test_*.py module
    pattern: from ${package} import ..., ${name}, ...
    condition: name.matches_regex(r"^test_\w*$")
    language: python
